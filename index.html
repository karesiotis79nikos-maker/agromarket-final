<!doctype html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroMarket Greece | B2B Αγροτική Αγορά</title>
  <meta name="description" content="B2B πλατφόρμα αγροτικών προϊόντων για παραγωγούς και αγοραστές σε όλη την Ελλάδα." />
  <style>
    :root{--bg:#071008;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.65);--green:#6ee7b7;--lime:#bef264;--dark:#052e1a;--white:#fff;--amber:#facc15}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:white}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 0 0,rgba(16,185,129,.22),transparent 34rem),radial-gradient(circle at 100% 100%,rgba(190,242,100,.12),transparent 34rem);z-index:-1}.container{max-width:1200px;margin:auto;padding:0 22px}.nav{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.45);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 22px;max-width:1200px;margin:auto}.brand{display:flex;align-items:center;gap:12px;cursor:pointer}.logo{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,var(--green),var(--lime),#fde68a);display:grid;place-items:center;color:#064e3b;font-size:26px;box-shadow:0 20px 50px rgba(16,185,129,.25)}.brand h1{font-size:20px;margin:0}.brand p{margin:1px 0 0;color:rgba(209,250,229,.65);font-size:11px;text-transform:uppercase;letter-spacing:.24em}.nav-buttons{display:flex;flex-wrap:wrap;gap:8px}.nav button,.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer;transition:.2s}.nav button{background:rgba(255,255,255,.06);color:rgba(255,255,255,.75)}.nav button.active,.btn.primary{background:var(--green);color:#052e1a}.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:white}.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:44px;align-items:center;padding:64px 0}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(110,231,183,.25);background:rgba(110,231,183,.10);color:#d1fae5;border-radius:999px;padding:10px 14px;font-size:14px}.hero h2,.page-title{font-size:clamp(42px,6vw,76px);line-height:1.03;margin:22px 0 0;letter-spacing:-.05em}.lead{font-size:18px;line-height:1.8;color:var(--muted);max-width:720px}.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}.hero-card{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:48px;padding:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}.hero-card img{width:100%;height:560px;object-fit:cover;border-radius:38px;display:block}.overlay{position:absolute;left:32px;right:32px;bottom:32px;border:1px solid var(--line);background:rgba(0,0,0,.58);backdrop-filter:blur(18px);border-radius:28px;padding:22px}.overlay h3{margin:10px 0 0;font-size:25px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(3,1fr);margin-top:44px}.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:28px;padding:24px;backdrop-filter:blur(18px)}.card .icon{font-size:28px;color:var(--green);margin-bottom:18px}.card .value{font-size:34px;font-weight:900}.card .label{font-size:14px;color:rgba(255,255,255,.58);line-height:1.45}.steps{grid-template-columns:repeat(3,1fr);margin:50px 0}.step-num{height:48px;width:48px;border-radius:18px;background:var(--green);color:#052e1a;display:grid;place-items:center;font-weight:900;font-size:20px;margin-bottom:22px}.two{grid-template-columns:repeat(2,1fr)}.four{grid-template-columns:repeat(4,1fr)}.six{grid-template-columns:repeat(6,1fr)}input,textarea,select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:18px;color:white;padding:15px 16px;outline:none}textarea{min-height:120px}label span{display:block;color:rgba(255,255,255,.65);font-size:14px;margin-bottom:8px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.role{padding:32px}.role h3,.panel h3{font-size:30px;margin:10px 0}.product-grid{grid-template-columns:repeat(4,1fr)}.product{overflow:hidden;padding:0}.product img{width:100%;height:210px;object-fit:cover}.product-body{padding:20px}.meta{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:rgba(209,250,229,.7)}.product h3{font-size:22px;margin:8px 0 0}.data-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.data{background:rgba(0,0,0,.26);border-radius:16px;padding:12px}.data small{display:block;color:rgba(255,255,255,.45)}.hidden-note{border:1px solid rgba(110,231,183,.18);background:rgba(110,231,183,.10);color:#ecfdf5;border-radius:16px;padding:12px;margin:14px 0;font-size:14px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.tabs button{border:0;border-radius:999px;padding:10px 15px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.72);cursor:pointer}.tabs button.active{background:var(--green);color:#052e1a;font-weight:900}.cost-grid{grid-template-columns:repeat(2,1fr)}.cost{background:rgba(0,0,0,.26);border-radius:18px;padding:16px}.cost.green{background:rgba(110,231,183,.12);color:#ecfdf5}.cost.strong{background:var(--green);color:#052e1a}.cost small{display:block;opacity:.7}.cost b{display:block;font-size:26px;margin-top:5px}.dashboard-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:28px}.status{border:1px solid rgba(110,231,183,.25);background:rgba(110,231,183,.1);color:#d1fae5;border-radius:999px;padding:10px 14px;font-size:14px}.list{display:grid;gap:12px;margin-top:18px}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(0,0,0,.25);border-radius:18px;padding:14px}.badge{background:#fde047;color:#422006;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}.search-row{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.search-row input{max-width:420px}.hide{display:none}@media (max-width:900px){.hero,.two{grid-template-columns:1fr}.stats,.steps,.product-grid,.four,.six{grid-template-columns:1fr}.form-grid,.cost-grid{grid-template-columns:1fr}.nav-inner{align-items:flex-start;flex-direction:column}.hero-card img{height:380px}.search-row{display:block}.search-row input{max-width:none;margin-top:16px}.page-title{font-size:44px}}
  </style>
</head>
<body>
  <header class="nav"><div class="nav-inner"><div class="brand" onclick="show('home')"><div class="logo">🌱</div><div><h1>AgroMarket Greece</h1><p>Greek Agricultural Exchange</p></div></div><nav class="nav-buttons" id="nav"></nav></div></header>
  <main class="container">
    <section id="home" class="screen"></section>
    <section id="register" class="screen hide"></section>
    <section id="producer" class="screen hide"></section>
    <section id="addProduct" class="screen hide"></section>
    <section id="buyer" class="screen hide"></section>
    <section id="catalog" class="screen hide"></section>
    <section id="order" class="screen hide"></section>
    <section id="admin" class="screen hide"></section>
  </main>
  <script>
    const FEE = 0.25;
    const products = [
      {id:1,name:'Πορτοκάλια Ηλείας Βαλέντσια',category:'Φρούτα',region:'Ηλεία',price:0.62,availableKg:15000,minKg:500,code:'AGR-ELI-2110',image:'https://images.unsplash.com/photo-1611080626919-7cf5a9dbab12?auto=format&fit=crop&w=1200&q=80'},
      {id:2,name:"Πατάτες Νευροκοπίου Α' Διαλογής",category:'Λαχανικά',region:'Δράμα',price:0.74,availableKg:22000,minKg:700,code:'AGR-DRA-1048',image:'https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=1200&q=80'},
      {id:3,name:'Τομάτες Κρήτης Θερμοκηπίου',category:'Κηπευτικά',region:'Κρήτη',price:1.12,availableKg:9000,minKg:300,code:'AGR-KRI-4162',image:'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&w=1200&q=80'},
      {id:4,name:'Ελαιόλαδο Μεσσηνίας Έξτρα Παρθένο',category:'Ελαιόλαδο',region:'Μεσσηνία',price:7.4,availableKg:4200,minKg:100,code:'AGR-MES-3096',image:'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=1200&q=80'}
    ];
    let selectedProduct = products[0];
    let activeScreen = 'home';
    const euro = v => '€' + Number(v).toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const navItems = [['home','Αρχική'],['register','Εγγραφή'],['producer','Παραγωγός'],['buyer','Αγοραστής'],['catalog','Προϊόντα'],['admin','Admin']];
    function renderNav(){document.getElementById('nav').innerHTML = navItems.map(([key,label])=>`<button class="${activeScreen===key?'active':''}" onclick="show('${key}')">${label}</button>`).join('')}
    function show(id){activeScreen=id;document.querySelectorAll('.screen').forEach(s=>s.classList.add('hide'));document.getElementById(id).classList.remove('hide');renderNav();window.scrollTo({top:0,behavior:'smooth'});if(id==='order') renderOrder();}
    function stat(icon,value,label){return `<div class="card"><div class="icon">${icon}</div><div class="value">${value}</div><div class="label">${label}</div></div>`}
    document.getElementById('home').innerHTML = `<div class="hero"><div><div class="pill">🔒 Κλειστή B2B αγορά αγροτικών προϊόντων</div><h2>Παραγωγοί πουλούν, αγοραστές παραγγέλνουν, όλα μέσα από την πλατφόρμα.</h2><p class="lead">Το AgroMarket Greece συνδέει παραγωγούς γεωργικών προϊόντων με επαγγελματίες αγοραστές σε όλη την Ελλάδα. Οι παραγωγοί καταχωρούν προϊόντα, τιμές και ποσότητες. Οι αγοραστές παραγγέλνουν απευθείας μέσα από την ιστοσελίδα, χωρίς να βλέπουν στοιχεία επικοινωνίας των παραγωγών.</p><div class="actions"><button class="btn primary" onclick="show('register')">Ξεκινήστε εγγραφή →</button><button class="btn ghost" onclick="show('catalog')">Δείτε προϊόντα</button></div><div class="grid stats">${stat('👁️','0','τηλέφωνα ή email ορατά μεταξύ χρηστών')}${stat('📊','0,25€','ανά κιλό στον παραγωγό και στον αγοραστή')}${stat('🧺','100%','καταχωρίσεις και αγορές μόνο μέσω ιστοσελίδας')}</div></div><div class="hero-card"><img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1400&q=80"><div class="overlay"><div style="color:#d1fae5">🛡️ Προστατευμένη συναλλαγή</div><h3>Μόνο η διαχείριση βλέπει πλήρη στοιχεία παραγωγών και αγοραστών.</h3></div></div></div><div class="grid steps">${[1,2,3].map((n,i)=>{const data=[['Εγγραφή & έγκριση','Παραγωγοί και αγοραστές κάνουν εγγραφή. Η διαχείριση ελέγχει και εγκρίνει τους λογαριασμούς.'],['Καταχώριση προϊόντων','Ο παραγωγός ανεβάζει προϊόν, τιμή ανά κιλό, διαθέσιμη ποσότητα, ελάχιστη παραγγελία και φωτογραφίες.'],['Παραγγελία','Ο αγοραστής βλέπει προϊόν, τιμή και ποσότητα και κάνει παραγγελία αποκλειστικά μέσα από την πλατφόρμα.']][i];return `<div class="card"><div class="step-num">${n}</div><h3>${data[0]}</h3><p class="lead" style="font-size:16px">${data[1]}</p></div>`}).join('')}</div>`;
    function field(label,ph,type='text'){return `<label><span>${label}</span><input type="${type}" placeholder="${ph}"></label>`}
    document.getElementById('register').innerHTML = `<div style="padding:40px 0"><h2 class="page-title" style="text-align:center">Εγγραφή στην πλατφόρμα</h2><p class="lead" style="text-align:center;margin:auto;margin-top:16px">Επιλέξτε ρόλο. Κάθε αίτηση εγκρίνεται από τη διαχείριση πριν αποκτήσει πρόσβαση στην αγορά.</p><div class="grid two" style="margin-top:34px"><div class="panel role"><div style="font-size:44px;color:#6ee7b7">🏭</div><h3>Εγγραφή παραγωγού</h3><p class="lead" style="font-size:16px">Για παραγωγούς που θέλουν να καταχωρούν διαθέσιμα γεωργικά προϊόντα και να δέχονται παραγγελίες μέσα από την πλατφόρμα.</p><div class="form-grid">${field('Ονοματεπώνυμο υπευθύνου','π.χ. Γιώργος Παπαδόπουλος')}${field('Επωνυμία παραγωγού','π.χ. Αγροκτήματα Ηλείας')}${field('Email','producer@business.gr')}${field('Τηλέφωνο','69xxxxxxxx')}${field('Περιοχή','π.χ. Ηλεία')}${field('Κατηγορίες προϊόντων','Φρούτα, λαχανικά, ελαιόλαδο')}</div><button class="btn primary" style="width:100%;margin-top:22px" onclick="show('producer')">Υποβολή αίτησης παραγωγού</button></div><div class="panel role"><div style="font-size:44px;color:#6ee7b7">🏪</div><h3>Εγγραφή αγοραστή</h3><p class="lead" style="font-size:16px">Για επαγγελματίες αγοραστές, καταστήματα, χονδρέμπορους, e-shops και επιχειρήσεις που θέλουν να παραγγέλνουν αγροτικά προϊόντα.</p><div class="form-grid">${field('Ονοματεπώνυμο υπευθύνου','π.χ. Μαρία Νικολάου')}${field('Επωνυμία επιχείρησης','π.χ. Fresh Market Αττικής')}${field('Email','buyer@business.gr')}${field('Τηλέφωνο','21xxxxxxxx')}${field('Τύπος επιχείρησης','Λιανική, χονδρική, e-shop')}${field('Προϊόντα ενδιαφέροντος','Φρούτα, λαχανικά, λάδι')}</div><button class="btn primary" style="width:100%;margin-top:22px" onclick="show('buyer')">Υποβολή αίτησης αγοραστή</button></div></div></div>`;
    function dashboard(title,subtitle,cards,body){return `<div class="dashboard-head"><div><h2 class="page-title">${title}</h2><p class="lead">${subtitle}</p></div><div class="status">Status: approved</div></div><div class="grid six">${cards.join('')}</div>${body}`}
    document.getElementById('producer').innerHTML = dashboard('Dashboard παραγωγού','Καλώς ήρθατε, Αγροκτήματα Ηλείας',[stat('📦','8','ενεργά προϊόντα'),stat('🧺','3','νέες παραγγελίες'),stat('🚚','2.700','kg σε παραγγελίες'),stat('📊','€675','χρεώσεις AgroMarket'),stat('✅','€1.691','καθαρό ποσό'),stat('🛡️','2','προϊόντα σε έγκριση')],`<div class="panel" style="margin-top:28px"><h3>Γρήγορες ενέργειες</h3><p class="lead" style="font-size:16px">Καταχώριση προϊόντος, προβολή παραγγελιών και οικονομικών.</p><div class="actions"><button class="btn primary" onclick="show('addProduct')">+ Προσθήκη προϊόντος</button><button class="btn ghost" onclick="show('catalog')">Προβολή καταλόγου</button></div></div>`);
    document.getElementById('buyer').innerHTML = dashboard('Dashboard αγοραστή','Καλώς ήρθατε, Fresh Market Αττικής',[stat('🧺','126','διαθέσιμα προϊόντα'),stat('🚚','4','ενεργές παραγγελίες'),stat('✅','18','ολοκληρωμένες'),stat('📊','8.200','kg παραγγελμένα'),stat('📊','€2.050','χρεώσεις AgroMarket')],`<div class="panel" style="margin-top:28px"><h3>Αγορά προϊόντων</h3><p class="lead" style="font-size:16px">Αναζήτηση προϊόντων ανά κατηγορία, περιοχή, τιμή και διαθέσιμη ποσότητα.</p><button class="btn primary" onclick="show('catalog')">Άνοιγμα καταλόγου</button></div>`);
    document.getElementById('addProduct').innerHTML = `<h2 class="page-title">Προσθήκη προϊόντος</h2><p class="lead">Το προϊόν εμφανίζεται στους αγοραστές μόνο μετά την έγκριση της διαχείρισης.</p><div class="panel" style="margin-top:28px"><div class="form-grid">${field('Όνομα προϊόντος','π.χ. Πορτοκάλια Ηλείας Βαλέντσια')}${field('Κατηγορία','Φρούτα / Λαχανικά / Ελαιόλαδο')}${field('Περιοχή παραγωγής','π.χ. Ηλεία')}${field('Τιμή ανά κιλό','π.χ. 0.65','number')}${field('Διαθέσιμα κιλά','π.χ. 15000','number')}${field('Ελάχιστη παραγγελία kg','π.χ. 500','number')}${field('Τύπος συσκευασίας','τελάρο 20kg / σάκος / παλέτα')}${field('Ποιότητα / διαλογή',"Α' διαλογή / premium / συμβατικό")}</div><textarea style="margin-top:16px" placeholder="Περιγραφή προϊόντος, εποχικότητα, διαθεσιμότητα και σημειώσεις προς διαχείριση..."></textarea><div style="margin-top:16px;border:1px dashed var(--line);border-radius:20px;padding:32px;text-align:center;color:rgba(255,255,255,.5)">Upload φωτογραφιών προϊόντος</div><button class="btn primary" style="width:100%;margin-top:22px" onclick="show('producer')">Υποβολή για έγκριση</button></div>`;
    function productCard(p){return `<div class="card product"><img src="${p.image}"><div class="product-body"><div class="meta">${p.category} · ${p.region}</div><h3>${p.name}</h3><div class="data-grid"><div class="data"><small>Τιμή</small><b>€${p.price}/kg</b></div><div class="data"><small>Διαθέσιμα</small><b>${p.availableKg.toLocaleString('el-GR')} kg</b></div><div class="data"><small>Ελάχιστη</small><b>${p.minKg} kg</b></div><div class="data"><small>Κωδικός</small><b>${p.code}</b></div></div><div class="hidden-note">👁️ Τα στοιχεία παραγωγού δεν εμφανίζονται.</div><button class="btn primary" style="width:100%" onclick="selectOrder(${p.id})">Παραγγελία προϊόντος</button></div></div>`}
    function renderCatalog(){document.getElementById('catalog').innerHTML = `<div class="search-row"><div><h2 class="page-title">Κατάλογος αγροτικών προϊόντων</h2><p class="lead">Οι αγοραστές βλέπουν προϊόν, τιμή, ποσότητα και περιοχή. Δεν βλέπουν τηλέφωνο, email ή πλήρη στοιχεία παραγωγού.</p></div><input id="search" placeholder="Αναζήτηση προϊόντος ή περιοχής..." oninput="filterProducts()"></div><div class="tabs" id="tabs"></div><div class="grid product-grid" id="productGrid"></div>`;renderTabs('Όλα');filterProducts();}
    function renderTabs(active){const cats=['Όλα','Φρούτα','Λαχανικά','Κηπευτικά','Ελαιόλαδο'];document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="${active===c?'active':''}" onclick="filterProducts('${c}')">${c}</button>`).join('');window.activeCat=active}
    function filterProducts(cat){if(cat)renderTabs(cat);const q=(document.getElementById('search')?.value||'').toLowerCase();const list=products.filter(p=>(window.activeCat==='Όλα'||p.category===window.activeCat)&&(`${p.name} ${p.category} ${p.region}`.toLowerCase().includes(q)));document.getElementById('productGrid').innerHTML=list.map(productCard).join('')}
    function selectOrder(id){selectedProduct=products.find(p=>p.id===id);show('order')}
    function renderOrder(){const p=selectedProduct||products[0];const kg=Number(document.getElementById('kg')?.value||p.minKg);const subtotal=kg*p.price,buyerFee=kg*FEE,producerFee=kg*FEE,buyerTotal=subtotal+buyerFee,producerNet=subtotal-producerFee,revenue=buyerFee+producerFee;document.getElementById('order').innerHTML=`<h2 class="page-title">Δημιουργία παραγγελίας</h2><p class="lead">Η παραγγελία γίνεται αποκλειστικά μέσα από την ιστοσελίδα. Η πλατφόρμα υπολογίζει αυτόματα τη χρέωση 0,25€ ανά κιλό σε κάθε πλευρά.</p><div class="grid two" style="margin-top:28px"><div class="card product"><img src="${p.image}" style="height:300px"><div class="product-body"><div class="meta">${p.category} · ${p.region}</div><h3>${p.name}</h3><div class="hidden-note">🔒 Ο αγοραστής δεν βλέπει στοιχεία παραγωγού. Ο παραγωγός δεν βλέπει στοιχεία αγοραστή.</div></div></div><div class="panel"><label><span>Ποσότητα σε κιλά</span><input id="kg" type="number" min="${p.minKg}" value="${kg}" oninput="renderOrder()"></label><p style="color:rgba(255,255,255,.45)">Ελάχιστη παραγγελία: ${p.minKg} kg</p><div class="grid cost-grid"><div class="cost"><small>Αξία προϊόντων</small><b>${euro(subtotal)}</b></div><div class="cost green"><small>Χρέωση αγοραστή</small><b>${euro(buyerFee)}</b></div><div class="cost strong"><small>Τελικό ποσό αγοραστή</small><b>${euro(buyerTotal)}</b></div><div class="cost green"><small>Χρέωση παραγωγού</small><b>${euro(producerFee)}</b></div><div class="cost"><small>Καθαρό ποσό παραγωγού</small><b>${euro(producerNet)}</b></div><div class="cost strong"><small>Έσοδο AgroMarket</small><b>${euro(revenue)}</b></div></div><button class="btn primary" style="width:100%;margin-top:24px" onclick="show('buyer')">Υποβολή παραγγελίας</button></div></div>`}
    document.getElementById('admin').innerHTML = `<h2 class="page-title">Admin panel</h2><p class="lead">Η διαχείριση βλέπει πλήρη στοιχεία παραγωγών και αγοραστών, εγκρίνει χρήστες και προϊόντα, παρακολουθεί παραγγελίες και ελέγχει χρεώσεις.</p><div class="grid six" style="margin-top:28px">${stat('👥','12','νέοι παραγωγοί')}${stat('🏪','18','νέοι αγοραστές')}${stat('📦','24','προϊόντα προς έγκριση')}${stat('🧺','9','νέες παραγγελίες')}${stat('🚚','14.800','συνολικά kg')}${stat('📊','€7.400','έσοδο AgroMarket')}</div><div class="grid two" style="margin-top:28px"><div class="panel"><h3>Έγκριση χρηστών</h3><div class="list">${['Αγροκτήματα Ηλείας · Παραγωγός','Fresh Market Αττικής · Αγοραστής','Θερμοκήπια Κρήτης · Παραγωγός'].map(x=>`<div class="list-row"><span>${x}</span><span class="badge">Pending</span></div>`).join('')}</div></div><div class="panel"><h3>Παραγγελίες & χρεώσεις</h3><div class="list">${[1000,700,1500].map((kg,i)=>`<div class="list-row"><span>ORD-240${18-i}</span><span>${kg} kg</span><b style="color:#d1fae5">${euro(kg*FEE*2)}</b></div>`).join('')}</div></div></div><div class="hidden-note" style="margin-top:28px;padding:22px">🛡️ Κανόνας πλατφόρμας: πλήρη στοιχεία, τηλέφωνα, email, ΑΦΜ και διευθύνσεις εμφανίζονται μόνο στη διαχείριση.</div>`;
    renderCatalog();renderNav();
  </script>
